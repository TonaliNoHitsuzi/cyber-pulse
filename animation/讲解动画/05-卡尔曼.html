const D = window.PULSE_DATA.good;
const VW = 1180, VH = 520;
function view(ctx, W, H) {

// ---------- Kalman on real beats ----------
function beatSeries() {
  const pk = D.peaks, out = [];
  for (let i = 0; i < pk.length - 2; i += 2) {
    const d = pk[i + 2][0] - pk[i][0];
    if (d > .3 && d < 1.4) out.push({ t: pk[i + 2][0], z: 60 / d });
  }
  return out;
}
const BEATS = beatSeries();
function runKF(seq, init, sa, sT) {
  let x = [init, 0];
  let P = [[400, 0], [0, 25]];
  let prev = seq[0].t;
  const out = [];
  for (const b of seq) {
    const dt = Math.max(.2, Math.min(2, b.t - prev)); prev = b.t;
    x = [x[0] + x[1] * dt, x[1]];
    const q00 = sa * sa * Math.pow(dt, 4) / 4, q01 = sa * sa * Math.pow(dt, 3) / 2, q11 = sa * sa * dt * dt;
    P = [[P[0][0] + dt * (P[1][0] + P[0][1]) + dt * dt * P[1][1] + q00,
          P[0][1] + dt * P[1][1] + q01],
         [P[1][0] + dt * P[1][1] + q01, P[1][1] + q11]];
    const R = Math.pow((x[0] * x[0] * sT / 60), 2);
    const S = P[0][0] + R;
    const K0 = P[0][0] / S, K1 = P[1][0] / S;
    const y = b.z - x[0];
    x = [x[0] + K0 * y, x[1] + K1 * y];
    const P00 = (1 - K0) * P[0][0], P01 = (1 - K0) * P[0][1], P11 = P[1][1] - K1 * P[0][1];
    P = [[P00, P01], [P01, P11]];
    out.push({ t: b.t, z: b.z, hr: x[0], v: x[1], sd: Math.sqrt(Math.max(0, P00)), K: K0, R });
  }
  return out;
}
const KF = runKF(BEATS, 120, 2.0, 0.02);
function median(a, k, n) {
  const s = a.slice(Math.max(0, k - n + 1), k + 1).map(x => x.z).sort((p, q) => p - q);
  return s[Math.floor(s.length / 2)];
}
// ---------- synthetic ramp ----------
function rampSeries() {
  const out = []; let t = 0;
  for (let k = 0; k < 90; k++) {
    let z = 80;
    if (t >= 5 && t < 20) z = 80 + (t - 5) * 70 / 15;
    if (t >= 20) z = 150;
    out.push({ t, z }); t += .5;
  }
  return out;
}
const RAMP = rampSeries();
const KFR = runKF(RAMP, 100, 2.0, 0.02);
function plotFrame(ctx, x, y, w, h, xmax, ymin, ymax, xlab, ylab) {
  A.grid(ctx, { x, y, w, h }, { step: 36 });
  const X = v => x + v / xmax * w;
  const Y = v => y + h - (v - ymin) / (ymax - ymin) * h;
  [ymin, Math.round((ymin + ymax) / 2), ymax].forEach(v => {
    A.line(ctx, x - 5, Y(v), x, Y(v), { color: '#2a4046' });
    A.text(ctx, String(v), x - 9, Y(v) + 3, { size: 9.5, mono: true, color: '#637875', align: 'right' });
  });
  A.text(ctx, xlab, x + w, y - 10, { size: 9.5, mono: true, color: '#637875', align: 'right' });
  A.text(ctx, ylab, x, y - 10, { size: 9.5, mono: true, color: '#637875' });
  if (xmax > 0) for (let k = 0; k <= xmax; k += Math.max(1, Math.round(xmax / 4))) {
    A.text(ctx, String(Math.round(k)), X(k), y + h + 16, { size: 9, mono: true, color: '#4d6663', align: 'center' });
  }

}

function realKF(ctx, t, y0) {
  const bx = 60, by = y0 + 50, bw = 760, bh = 300;

  const P = plotFrame(ctx, bx, by, bw, bh, EST.length - 1, 60, 130, '拍序号', 'BPM');
  const reveal = Math.min(EST.length, 2 + Math.floor(t / 9 * EST.length));
  // band
  for (let k = 1; k < reveal; k++) {
    const x1 = P.X(k - 1), x2 = P.X(k);
    const a = EST[k - 1], b = EST[k];
    ctx.save(); ctx.fillStyle = 'rgba(98,240,182,.12)';
    ctx.beginPath();
    ctx.moveTo(x1, P.Y(a.hr + 2 * a.sd));
    ctx.lineTo(x2, P.Y(b.hr + 2 * b.sd));
    ctx.lineTo(x2, P.Y(b.hr - 2 * b.sd));
    ctx.lineTo(x1, P.Y(a.hr - 2 * a.sd));
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  // measurements
  for (let k = 1; k < reveal; k++) A.dot(ctx, P.X(k), P.Y(EST[k].z), 2, 'rgba(255,180,84,.8)');
  // estimate
  const pts = [];
  for (let k = 0; k < reveal; k++) pts.push([P.X(k), P.Y(EST[k].hr)]);

function rampKF(ctx, t, y0) {
