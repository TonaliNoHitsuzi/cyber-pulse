<script>
const VW = 1180, VH = 520;
const FS = 200, N = 160;
function view(ctx, W, H) {
  const s = Math.min(W / VW, H / VH);
  ctx.save(); ctx.translate((W - VW * s) / 2, (H - VH * s) / 2); ctx.scale(s, s);

function footer(ctx, right) {

  let x = 120;
  items.forEach(([k, v]) => {
    A.text(ctx, k, x, 502, { size: 10, mono: true, color: '#637875' });

// firmware parametric template, sampled N points over one period
function tmpl(x) {
  const a = Math.exp(-Math.pow((x - .14) / .055, 2) / 2);
  const b = .42 * Math.exp(-Math.pow((x - .42) / .075, 2) / 2);
  const c = .10 * Math.exp(-Math.max(0, x - .45) / .22);
  return a + b + c;
}
const T = [];
for (let i = 0; i < N; i++) T.push(tmpl(i / (N - 1)));
function norm(a) {
  const m = a.reduce((s, v) => s + v, 0) / a.length;
  const b = a.map(v => v - m);
  const e = Math.sqrt(b.reduce((s, v) => s + v * v, 0)) || 1;
  return b.map(v => v / e);
}
const TN = norm(T);
// synthetic clean signal, 3 beats @ 80 BPM (period .75 s), deterministic noise
function makeSig(period, beats, noise) {
  const len = Math.round((period * beats + .4) * FS);
  const out = new Array(len).fill(0);
  for (let b = 0; b < beats; b++) {
    const start = Math.round(b * period * FS);
    for (let i = 0; i < Math.round(period * FS); i++) {
      const u = i / (period * FS);
      out[start + i] += tmpl(u) * (1 + .03 * Math.sin(i * .9));
    }
  }
  for (let i = 0; i < len; i++) out[i] += noise * (Math.sin(i * 1.7) * .5 + Math.sin(i * .37 + 1) * .5);
  return out;
}
const SIG = makeSig(.75, 3, .035);
function nccAt(sig, off) {
  if (off < 0 || off + N > sig.length) return -1;
  const w = norm(sig.slice(off, off + N));
  let s = 0;
  for (let i = 0; i < N; i++) s += w[i] * TN[i];
  return s;
}
function nccCurve(sig, maxOff) {
  const out = [];
  for (let o = 0; o <= maxOff; o++) out.push(nccAt(sig, o));
  return out;
}
const MAXOFF = Math.round(.75 * FS);
const SC = nccCurve(SIG, MAXOFF);
let best = 0;
for (let i = 0; i < SC.length; i++) if (SC[i] > SC[best]) best = i;
console.log('best', best, SC[best], 'at 0.36s', nccAt(SIG, Math.round(.36 * FS)));
function concept(ctx, t, y0) {

    { x: 420, title: '细档 · 波形模板 NCC', sub: '用“整段波形形态”匹配', c: '#62f0b6', kind: 'beat', note: '问：这 0.8 秒像不像一段完整脉搏波形？' }
  ];
  cards.forEach(c => {
    const y = y0 + 24, w = 320, h = 250;
    A.rr(ctx, c.x, y, w, h, 3); ctx.fillStyle = 'rgba(14,22,25,.8)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.stroke();
    A.text(ctx, c.title, c.x + 18, y + 32, { size: 16, weight: 600, color: c.c });
    A.text(ctx, c.sub, c.x + 18, y + 54, { size: 11, mono: true, color: '#8fa5a2' });
    const bx = c.x + 20, by = y + 74, bw = w - 40, bh = 116;
    A.grid(ctx, { x: bx, y: by, w: bw, h: bh }, { step: 24 });
    const pts = [];

      for (let i = 0; i < 100; i++) {

  stages.forEach((st, i) => {

  A.text(ctx, '本页讲②，下一页讲③', rx + 300, y0 + 322, { size: 10, mono: true, color: '#637875', align: 'right' });

function slideScene(ctx, t, y0) {
  const bx = 70, by = y0 + 34, bw = 700, bh = 150;
  A.grid(ctx, { x: bx, y: by, w: bw, h: bh }, { step: 30 });
  const ymax = 1.1;
  const sx = i => bx + i / (SIG.length - 1) * bw;
  const sy = v => by + bh - 8 - Math.min(v, ymax) / ymax * (bh - 16);
  const pts = SIG.map((v, i) => [sx(i), sy(v)]);
  A.path(ctx, pts, { color: '#8fa5a2', width: 1.2, alpha: .55 });
  // sliding window
  const u = Math.min(1, t / 4.2);
  const off = Math.round(u * MAXOFF);
  const wxe = sx(off), wxe2 = sx(off + N);
  ctx.save(); ctx.fillStyle = 'rgba(98,240,182,.08)'; ctx.fillRect(wxe, by, wxe2 - wxe, bh); ctx.restore();
  const wp = SIG.slice(off, off + N).map((v, i) => [sx(off + i), sy(v)]);
  A.path(ctx, wp, { color: '#62f0b6', width: 1.8, glow: '#62f0b6' });
  A.line(ctx, wxe, by, wxe, by + bh, { color: '#c8f560', alpha: .5 });
  A.text(ctx, '滑动窗口', wxe + 6, by + 16, { size: 10, mono: true, color: '#c8f560' });
  A.text(ctx, '合成心搏（3 拍 @80）', bx, by - 10, { size: 10.5, mono: true, color: '#8fa5a2' });
  // NCC curve
  const ny = y0 + 225, nh = 150;
  A.grid(ctx, { x: bx, y: ny, w: bw, h: nh }, { step: 30 });
  A.line(ctx, bx, ny + nh - (1 + 1) / 2 * nh, bx + bw, ny + nh - (1 + 1) / 2 * nh, { color: '#2a4046', dash: [4, 4] });
  const npts = [];
  const upto = Math.max(2, Math.floor(u * SC.length));
  for (let i = 0; i < upto; i++) npts.push([bx + i / (SC.length - 1) * bw, ny + nh - (SC[i] + 1) / 2 * nh]);
  A.path(ctx, npts, { color: '#57c8ff', width: 1.6, glow: '#57c8ff' });
  const curScore = SC[Math.min(upto - 1, SC.length - 1)];
  A.dot(ctx, bx + (upto - 1) / (SC.length - 1) * bw, ny + nh - (curScore + 1) / 2 * nh, 4, '#c8f560', true);
  A.text(ctx, 'NCC 相似度', bx, ny - 10, { size: 10.5, mono: true, color: '#57c8ff' });
  A.text(ctx, '1.0', bx - 8, ny + 10, { size: 9, mono: true, color: '#637875', align: 'right' });
  A.text(ctx, '-1.0', bx - 8, ny + nh, { size: 9, mono: true, color: '#637875', align: 'right' });
  // right readout
  const rx = 820;
  A.text(ctx, '当前窗口', rx, y0 + 64, { size: 10, mono: true, color: '#637875' });
  A.text(ctx, 'NCC = ' + curScore.toFixed(2), rx, y0 + 108, { size: 30, mono: true, color: curScore > .8 ? '#62f0b6' : curScore > .4 ? '#ffb454' : '#ff6f6f' });
  A.text(ctx, '阈值约 0.8', rx, y0 + 136, { size: 11, color: '#8fa5a2' });
  A.text(ctx, '整段最高 ' + SC[best].toFixed(2), rx, y0 + 178, { size: 13, mono: true, color: '#62f0b6' });
  A.text(ctx, '（真实记录里原型最高 0.78）', rx, y0 + 200, { size: 10, color: '#637875' });
  A.text(ctx, '窗口开始时', rx, y0 + 246, { size: 11, color: '#8fa5a2' });
  A.text(ctx, '整段波形一起参与打分，', rx, y0 + 268, { size: 11, color: '#b9cbc7' });
  A.text(ctx, '不是只看一个点的尖。', rx, y0 + 290, { size: 11, color: '#b9cbc7' });
}
function screenScene(ctx, t, y0) {
  // left: signal with two candidate positions
  const bx = 70, by = y0 + 50, bw = 660, bh = 170;
  A.grid(ctx, { x: bx, y: by, w: bw, h: bh }, { step: 30 });
  const sx = i => bx + i / (SIG.length - 1) * bw, sy = v => by + bh - 8 - Math.min(v, 1.1) / 1.1 * (bh - 16);

}
function halfScene(ctx, t, y0) {

    body: '加形态校验后，150 BPM 的真拍仍能 100% 保留；可配对方式还是“隔一个峰”，高心率时它跨了<b>两拍</b>（800 ms），输出依然是 <span class="wrong">75</span>。所以还需要第三层：按当前周期动态配对 + 卡尔曼。',

const deck = new Deck({
  steps,
  draw(ctx, W, H) {
    view(ctx, W, H);
    const y0 = 78, s = deck.step, t = deck.t;
    if (s === 0) { header(ctx, '先粗筛，再细看', '峰 = 一个尖 · 模板匹配 = 整段心搏'); concept(ctx, t, y0); }
    else if (s === 1) { header(ctx, '整段波形一起打分', '滑窗相关系数 · 合成图示意'); slideScene(ctx, t, y0); }

    else { header(ctx, '形态对了，配对仍然会错', '仿真：真拍保留率 vs i+2 半值'); halfScene(ctx, t, y0); }
    footer(ctx, s < 3 ? '下一页：贝叶斯融合 →' : '下一页：贝叶斯融合 →');
    ctx.restore();
  }
});
