<script>
const VW = 1180, VH = 520;
function view(ctx, W, H) {
  const s = Math.min(W / VW, H / VH);
  ctx.save(); ctx.translate((W - VW * s) / 2, (H - VH * s) / 2); ctx.scale(s, s);
}
function header(ctx, title, sub) {
  A.text(ctx, title, 60, 34, { size: 20, serif: true, weight: 600 });
  A.text(ctx, sub, 60, 56, { size: 11.5, mono: true, color: '#637875' });
}
function footer(ctx, right) {
  A.line(ctx, 40, 480, 1140, 480, { color: '#1d2c31' });
  A.text(ctx, '今天的原则', 40, 502, { size: 10, mono: true, color: '#637875' });
  const items = [['不是', '加新算法'], ['而是', '守住边界'], ['顺序', '现象→原理→门控→结果'], ['底线', '不伤真信号']];
  let x = 140;
  items.forEach(([k, v]) => {
    A.text(ctx, k, x, 502, { size: 10, mono: true, color: '#637875' });
    A.text(ctx, v, x + 34, 502, { size: 11, mono: true, color: '#c6d6d2' });
    x += 220;
  });
  A.text(ctx, right, 1140, 502, { size: 10.5, mono: true, color: '#637875', align: 'right' });
}
function gateRow(ctx, cards, phase) {
  const x0 = 40, y = 6, w = 262, h = 88, gap = 20;
  cards.forEach((c, i) => {
    const x = x0 + i * (w + gap), on = i === phase;
    A.rr(ctx, x, y, w, h, 3);
    ctx.fillStyle = on ? 'rgba(98,240,182,.07)' : 'rgba(14,22,25,.7)'; ctx.fill();
    ctx.strokeStyle = on ? c.c : '#1d2c31'; ctx.lineWidth = on ? 1.4 : 1;
    if (on) { ctx.shadowColor = c.c; ctx.shadowBlur = 14; }
    ctx.stroke(); ctx.shadowBlur = 0;
    A.text(ctx, ['现象', '识别原理', '门控 / 修复', '结果'][i], x + 14, y + 22, { size: 9.5, mono: true, color: on ? c.c : '#4d6663' });
    A.text(ctx, c.v, x + 14, y + 56, { size: 13, weight: 600, color: on ? '#e8f2ef' : '#8fa5a2' });
    A.text(ctx, c.s, x + 14, y + 76, { size: 9.5, mono: true, color: on ? c.c : '#637875' });
    if (i < 3) A.arrow(ctx, x + w + 3, y + h / 2, x + w + gap - 3, y + h / 2, '#2a4046', 1.1);
  });
}
function phaseOf(t) { return Math.min(3, Math.floor(t / 1.9)); }
function overviewScene(ctx, y0) {
  const items = [
    ['时基（根因）', '恒定 78', 'seq×5ms', '72–84'],
    ['CV 门', '78 仍放行', 'CV 算 i+2 天然规整', '没挡住'],
    ['冷启动', '先空后跳数', '≥5 间隔+2s', '3.5s'],
    ['补发 / 旧值', '悬空 78', 'p50 30 + 1.5s', '零假阳'],
    ['跑步', '显示 78/82', '暂无门控', '真值 80–92'],
    ['采集', '莫名断连', 'DTR/互斥/停扫', '49/49']
  ];
  A.text(ctx, '一条因果链：延迟 → 78 → CV 误判 → 时基修复；其余是边界', 60, y0 + 26, { size: 13, color: '#e8f2ef' });
  items.forEach((it, i) => {
    const x = 60 + (i % 3) * 350, y = y0 + 48 + Math.floor(i / 3) * 138;
    A.rr(ctx, x, y, 330, 120, 3); ctx.fillStyle = 'rgba(14,22,25,.7)'; ctx.fill();
    ctx.strokeStyle = '#1d2c31'; ctx.stroke();
    A.text(ctx, it[0], x + 16, y + 26, { size: 12, mono: true, color: '#62f0b6' });
    A.text(ctx, '现象', x + 16, y + 52, { size: 9, mono: true, color: '#637875' });
    A.text(ctx, it[1], x + 54, y + 52, { size: 10.5, color: '#ff9a9a' });
    A.text(ctx, '门控', x + 16, y + 76, { size: 9, mono: true, color: '#637875' });
    A.text(ctx, it[2], x + 54, y + 76, { size: 10.5, color: '#8ef0c8' });
    A.text(ctx, '结果', x + 16, y + 100, { size: 9, mono: true, color: '#637875' });
    A.text(ctx, it[3], x + 54, y + 100, { size: 10.5, color: '#ffd08a' });
  });
  A.text(ctx, '注：悬空 78 是 App 旧值；跑步 78 是 i+2 偏差——都不是延迟 78。', 60, y0 + 330, { size: 10, color: '#8fa5a2' });
}
function pathScene(ctx, t, y0) {

    ['02', '先加 CV 门', '想滤掉噪声', C.amber],
    ['03', 'CV 没挡住', 'i+2 天然规整', C.coral],

  A.text(ctx, '今天的实际顺序：先误判，后抓到延迟', 60, y0 + 34, { size: 16, color: '#e8f2ef' });

  items.forEach((it, i) => {
    const x = 100 + i * 190, y = y0 + 170;

  A.text(ctx, 'CV 只是缓解；根因只有一个：延迟', 60, y0 + 300, { size: 15, color: '#ffb454' });
  A.text(ctx, '下一幕：把窗宽缩到 600ms，看 217ms 的卡顿怎样压缩时间戳。', 60, y0 + 330, { size: 11, color: '#c6d6c2' });
}

function timeScene(ctx, t, y0) {
  const bx = 60, by = y0 + 50, bw = 720, bh = 100;
  // 600 ms window: 217 ms lag is 1/3 of the width
  const N = 120, wave = [];
  for (let i = 0; i < N; i++) {
    const tt = i / 200;
    let v = .05 * (Math.sin(i * 1.7) * .5 + Math.sin(i * .37 + 1) * .5);
    [.10, .465].forEach(p => v += Math.exp(-Math.pow((tt - p) / .026, 2)));
    wave.push(v);
  }
  const env = A.envMax(wave, 5, 5);
  const X = i => bx + i / (N - 1) * bw;
  const Y = v => by + bh - Math.min(v, 1.15) / 1.15 * bh;
  A.grid(ctx, { x: bx, y: by, w: bw, h: bh }, { step: 24 });
  A.path(ctx, wave.map((v, i) => [X(i), Y(v)]), { color: 'rgba(98,240,182,.35)', width: 1 });
  A.path(ctx, env.map((v, i) => [X(i), Y(v)]), { color: '#7df9c4', width: 2, glow: '#62f0b6' });
  A.text(ctx, '窗宽 600ms（放大看）', bx, by - 12, { size: 11, mono: true, color: '#e8f2ef' });
  [.10, .465].forEach((p, i) => A.dot(ctx, bx + p / .6 * bw, Y(env[Math.round(p * 200)]), 4, i ? '#57c8ff' : '#ffb454'));
  [0, .3, .6].forEach(p => {
    const x = bx + p / .6 * bw;
    A.line(ctx, x, by + bh, x, by + bh + 5, { color: '#2a4046' });
    A.text(ctx, Math.round(p * 1000) + ' ms', x, by + bh + 17, { size: 9, mono: true, color: '#637875', align: 'center' });
  });

  // ADC clock: one window every 25 ms
  const y1 = by + bh + 44;
  A.line(ctx, bx, y1, bx + bw, y1, { color: '#2a4046' });
  A.text(ctx, 'ADC 采样时钟：5ms/窗口（每 25ms 标一格）', bx, y1 - 10, { size: 10, mono: true, color: '#62f0b6' });
  for (let k = 0; k * .025 < .6; k++) {
    const x = bx + k * .025 / .6 * bw;
    A.line(ctx, x, y1 - 5, x, y1 + 5, { color: '#62f0b6' });
  }

  // main loop: stuck for 217 ms, then processes the backlog
  const y2 = y1 + 48;
  A.line(ctx, bx, y2, bx + bw, y2, { color: '#2a4046' });
  A.text(ctx, '主循环处理：卡顿后一次性打时间戳', bx, y2 - 10, { size: 10, mono: true, color: '#ff6f6f' });
  const lx0 = bx + .183 / .6 * bw, lx1 = bx + .400 / .6 * bw;
  A.line(ctx, lx0, y2 - 12, lx1, y2 - 12, { color: '#ff6f6f', width: 2 });
  A.text(ctx, '卡住 217ms', (lx0 + lx1) / 2, y2 - 18, { size: 10, mono: true, color: '#ff6f6f', align: 'center' });
  A.line(ctx, lx1, y2 - 8, lx1, y2 + 12, { color: '#ff6f6f', width: 3 });
  for (let k = 0; k < 8; k++) A.line(ctx, lx1 + k * 1.2, y2 - 6, lx1 + k * 1.2, y2 + 6, { color: '#ffb454', width: 1 });

  // 40 ms inset: all backlog timestamps collapse to one instant
  const ix = 60, iy = y2 + 42, iw = 360;
  A.text(ctx, '40ms 放大：恢复处理时，40 个窗口挤在 ~1ms', ix, iy - 8, { size: 9.8, mono: true, color: '#ff9a9a' });
  A.line(ctx, ix, iy + 24, ix + iw, iy + 24, { color: '#2a4046' });
  for (let k = 0; k < 8; k++) {
    const x = ix + k * 5 / 40 * iw;
    A.line(ctx, x, iy + 16, x, iy + 24, { color: '#62f0b6' });
  }
  for (let k = 0; k < 8; k++) A.line(ctx, ix + 20 / 40 * iw + k * .8, iy + 24, ix + 20 / 40 * iw + k * .8, iy + 34, { color: '#ff6f6f' });
  A.text(ctx, 'ADC', ix + iw + 8, iy + 20, { size: 9, mono: true, color: '#62f0b6' });
  A.text(ctx, '处理', ix + iw + 8, iy + 32, { size: 9, mono: true, color: '#ff6f6f' });

  // right panel
  const rx = 820;
  A.text(ctx, '为什么之前看不出来', rx, y0 + 60, { size: 12, mono: true, color: '#637875' });
  A.text(ctx, '窗宽 3s 时，217ms 只占 7%，', rx, y0 + 86, { size: 10.5, color: '#c6d6c2' });
  A.text(ctx, '看起来像“正常抖动”。', rx, y0 + 104, { size: 10.5, color: '#c6d6c2' });
  A.text(ctx, '600ms 窗里，它占 1/3。', rx, y0 + 132, { size: 11, color: '#ffb454' });
  A.text(ctx, '采样序号：5ms 一步', rx, y0 + 170, { size: 10.5, mono: true, color: '#62f0b6' });
  A.text(ctx, '处理时间戳：卡顿后一次性打', rx, y0 + 192, { size: 10.5, mono: true, color: '#ff6f6f' });
  A.text(ctx, '→ 间隔压缩 → 78 恒定', rx, y0 + 220, { size: 12, color: '#ff9a9a' });
  A.chip(ctx, rx, y0 + 242, '修复：seq×5ms → 72–84', '#62f0b6');
  A.rr(ctx, rx, y0 + 278, 310, 96, 3); ctx.fillStyle = 'rgba(87,200,255,.05)'; ctx.fill();
  ctx.strokeStyle = 'rgba(87,200,255,.3)'; ctx.stroke();
  A.text(ctx, '通用原则', rx + 12, y0 + 298, { size: 10, mono: true, color: '#57c8ff' });
  A.text(ctx, '时间基准 = 采样序号 / 硬件时钟，', rx + 12, y0 + 318, { size: 10.2, color: '#c6d6c2' });
  A.text(ctx, '不是处理线程的 now()。', rx + 12, y0 + 335, { size: 10.2, color: '#c6d6c2' });
  A.text(ctx, 'ADC / IMU / 音频 / 摄像头同理。', rx + 12, y0 + 354, { size: 9.8, color: '#8fa5a2' });
}

function cvScene(ctx, t, y0) {
  const bx = 60, by = y0 + 94, bw = 660;
  // weak-signal waveform: noise peaks near 350 ms
  const wx = 60, wy = y0 + 32, ww = 520, wh = 58;
  const wv = [];
  for (let i = 0; i < 260; i++) {
    const tt = i / 200;
    let v = .08 * Math.sin(i * 1.3) + .05 * Math.sin(i * .41 + 1);
    for (let k = 0; k < 4; k++) v += Math.exp(-Math.pow((tt - (.2 + k * .35)) / .028, 2));
    wv.push(v);
  }
  const wxX = i => wx + i / (wv.length - 1) * ww, wxY = v => wy + wh - Math.min(v, 1.2) / 1.2 * wh;
  A.path(ctx, wv.map((v, i) => [wxX(i), wxY(v)]), { color: 'rgba(98,240,182,.45)', width: 1.1 });
  for (let k = 0; k < 4; k++) A.dot(ctx, wxX(Math.round((.2 + k * .35) * 200)), wxY(1), 2.5, '#ff6f6f');
  A.text(ctx, '弱信号波形：i+1 噪声峰贴 350ms（示意）', wx, wy - 8, { size: 9.8, mono: true, color: '#ff9a9a' });

  // i+1 axis
  A.line(ctx, bx, by + 64, bx + bw, by + 64, { color: '#2a4046' });
  [300, 450, 600, 750, 900].forEach(v => {
    const x = bx + (v - 300) / 600 * bw;
    A.line(ctx, x, by + 56, x, by + 72, { color: '#2a4046' });
    A.text(ctx, v + ' ms', x, by + 86, { size: 9, mono: true, color: '#637875', align: 'center' });
  });
  A.text(ctx, 'i+1 间隔分布：真脉搏 750–780ms，CV = 0.020', bx, by + 18, { size: 10.5, mono: true, color: '#62f0b6' });
  for (let i = 0; i < 10; i++) {
    const v = 752 + (i % 5) * 6 + (i % 3) * 2;
    A.dot(ctx, bx + (v - 300) / 600 * bw, by + 38, 3, '#62f0b6');
  }
  A.text(ctx, '噪声 i+1：350ms 附近，CV = 0.17 → 拒', bx, by + 110, { size: 10.5, mono: true, color: '#ff6f6f' });
  for (let i = 0; i < 10; i++) {
    const v = 350 + (i * 37) % 70;
    A.dot(ctx, bx + (v - 300) / 600 * bw, by + 130, 3, '#ff6f6f');
  }
  A.text(ctx, 'i+1 判据有效：0.17 > 0.12 拒，0.020 < 0.12 过', bx, by + 166, { size: 10, mono: true, color: '#8fa5a2' });

  // right panel: why i+2 fails
  const rx = 760;
  A.text(ctx, '固件实际算的是 i+2', rx, y0 + 70, { size: 12, mono: true, color: '#ff9a9a' });
  A.text(ctx, 'i+2 跨整个周期，抖动被平均掉', rx, y0 + 94, { size: 10.5, color: '#c6d6c2' });
  A.text(ctx, 'i+2 间隔 CV', rx, y0 + 120, { size: 9.5, mono: true, color: '#637875' });
  A.text(ctx, '拒绝率', rx + 250, y0 + 120, { size: 9.5, mono: true, color: '#637875', align: 'right' });
  const rows = [
    ['今天 78', '0.068', '5%', '#ff6f6f'],
    ['真脉搏', '0.012', '0%', '#62f0b6'],
    ['跑步', '0.025', '8%', '#ffb454']
  ];
  rows.forEach((r, i) => {
    const yy = y0 + 144 + i * 22;
    A.text(ctx, r[0], rx, yy, { size: 10.2, mono: true, color: r[3] });
    A.text(ctx, r[1], rx + 155, yy, { size: 10.2, mono: true, color: r[3] });
    A.text(ctx, r[2], rx + 250, yy, { size: 10.2, mono: true, color: r[3], align: 'right' });
  });
  A.text(ctx, '都 < 0.12 → 放行', rx, y0 + 222, { size: 12, color: '#ff6f6f' });
  A.text(ctx, '所以 78 没被挡住，反而更稳', rx, y0 + 244, { size: 10.2, color: '#ff9a9a' });
  A.text(ctx, 'CV 算在 i+2 上 → 无效', rx, y0 + 274, { size: 12.5, mono: true, color: '#ff6f6f' });
  A.chip(ctx, rx, y0 + 292, '正确：先 seq，再算 i+1', '#57c8ff');

  // bottom
  A.text(ctx, '先修时基，再把 CV 算在 i+1；顺序反了，门控会帮倒忙。', bx, by + 196, { size: 10.5, color: '#8fa5a2' });
  A.text(ctx, '时基修好后同刻 1 BPM，46/49 帧出数', bx + bw, by + 196, { size: 9.8, mono: true, color: '#62f0b6', align: 'right' });
}
function coldScene(ctx, t, y0) {
  const bx = 80, by = y0 + 110, bw = 620, bh = 170;
  const X = s => bx + s / 5 * bw;
  A.line(ctx, bx, by + bh, bx + bw, by + bh, { color: '#2a4046' });
  for (let s = 0; s <= 5; s++) {
    A.line(ctx, X(s), by + bh - 4, X(s), by + bh + 4, { color: '#2a4046' });
    A.text(ctx, s + 's', X(s), by + bh + 20, { size: 9, mono: true, color: '#637875', align: 'center' });
  }
  // output step
  const pts = [];
  for (let s = 0; s <= 5; s += .02) {
    const v = s >= 3.5 ? 78 : 0;
    pts.push([X(s), by + bh - 10 - v / 90 * (bh - 30)]);
  }
  A.path(ctx, pts, { color: '#62f0b6', width: 2.2, glow: '#62f0b6' });
  A.line(ctx, X(3.5), by + 10, X(3.5), by + bh, { color: '#ffb454', dash: [4, 4] });
  A.text(ctx, '门开：3.5s', X(3.5), by + 6, { size: 10.5, mono: true, color: '#ffb454', align: 'center' });
  A.text(ctx, '输出/---', bx, by + 10, { size: 10, mono: true, color: '#637875' });
  // interval markers
  for (let i = 0; i < 3; i++) A.dot(ctx, X(.6 + i * .5), by + bh + 40, 2.5, '#ff6f6f');
  A.text(ctx, '3 个间隔：CV 不可靠', X(1.0), by + bh + 62, { size: 10, mono: true, color: '#ff9a9a', align: 'center' });
  for (let i = 0; i < 5; i++) A.dot(ctx, X(.6 + i * .55), by + bh + 84, 2.5, '#62f0b6');
  A.text(ctx, '≥5 个间隔 + 连续 2s 通过', X(1.6), by + bh + 106, { size: 10, mono: true, color: '#62f0b6', align: 'center' });
  // right
  const rx = 780;
  A.text(ctx, '冷启动保护', rx, y0 + 78, { size: 11, mono: true, color: '#637875' });
  A.text(ctx, '首出 3.5s', rx, y0 + 120, { size: 28, mono: true, color: '#ffb454' });
