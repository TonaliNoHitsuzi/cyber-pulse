    A.line(ctx, x, by + bh, x, by + bh - Math.min(seg[i], ymax) / ymax * bh, { color: 'rgba(255,180,84,.45)', width: 1 });
  });
  if (withCursor) {
    const u = (t * .18) % 1;
    const x = bx + u * bw;
    A.line(ctx, x, by, x, by + bh, { color: '#c8f560', alpha: .5 });
    const idx = Math.floor(u * (seg.length - 1));
    const v = seg[idx];
    A.dot(ctx, x, by + bh - Math.min(v, ymax) / ymax * bh, 3.5, '#c8f560', true);
    A.text(ctx, 'dev = ' + v.toFixed(0), x + 10, by + 18, { size: 12, mono: true, color: '#c8f560' });

function segPeaks() {
  return D.peaks.filter(p => p[0] >= D.seg_t0 && p[0] < D.seg_t0 + 6).map(p => [p[0] - D.seg_t0, p[1]]);

function finalScene(ctx, t, y0) {
  const bx = 70, by = y0 + 46, bw = 1040, bh = 272;
  const ymax = 380;
  A.grid(ctx, { x: bx, y: by, w: bw, h: bh }, { step: 40 });
  const pts = D.seg_dev.map((v, i) => [bx + i / (D.seg_dev.length - 1) * bw, by + bh - Math.min(v, ymax) / ymax * bh]);
  A.path(ctx, pts, { color: 'rgba(98,240,182,.35)', width: 1.1 });
  const envPts = ENV.map((v, i) => [bx + i / (ENV.length - 1) * bw, by + bh - Math.min(v, ymax) / ymax * bh]);
  A.path(ctx, envPts, { color: '#7df9c4', width: 2.2, glow: '#62f0b6' });
  A.text(ctx, '亮线 = 显示用包络（不参与计算）', bx + bw - 4, by + 16, { size: 9.5, mono: true, color: '#7a938e', align: 'right' });
  const peaks = segPeaks();
  peaks.forEach((p, i) => {
    const idx = Math.max(0, Math.min(ENV.length - 1, Math.round(p[0] / .005)));
    const x = bx + p[0] / 6 * bw, y = by + bh - Math.min(ENV[idx], ymax) / ymax * bh;
    const main = i % 2 === 0;
    A.dot(ctx, x, y, main ? 3.6 : 3, main ? '#ffb454' : '#57c8ff', true, main ? '#ffb454' : '#57c8ff');
  });
  // legend
  A.dot(ctx, bx + 6, by + 16, 3.4, '#ffb454', true);
  A.text(ctx, '主峰（心缩冲击）', bx + 16, by + 20, { size: 10.5, color: '#ffb454' });
  A.dot(ctx, bx + 166, by + 16, 3, '#57c8ff', true);
  A.text(ctx, '第二峰', bx + 176, by + 20, { size: 10.5, color: '#57c8ff' });
  const a = peaks[2], b = peaks[3], c = peaks[4];
  if (a && b && c) {
    const xa = bx + a[0] / 6 * bw, xb = bx + b[0] / 6 * bw, xc = bx + c[0] / 6 * bw;
    const yy = by + bh + 26;
    A.line(ctx, xa, yy, xb, yy, { color: '#ffb454', width: 1.2 });
    A.line(ctx, xa, yy - 5, xa, yy + 5, { color: '#ffb454' });
    A.line(ctx, xb, yy - 5, xb, yy + 5, { color: '#ffb454' });
    A.text(ctx, '双峰间隔 ≈ 360 ms', (xa + xb) / 2, yy - 7, { size: 10, mono: true, color: '#ffb454', align: 'center' });
    const y2 = yy + 24;
    A.line(ctx, xa, y2, xc, y2, { color: '#62f0b6', width: 1.2 });
    A.line(ctx, xa, y2 - 5, xa, y2 + 5, { color: '#62f0b6' });
    A.line(ctx, xc, y2 - 5, xc, y2 + 5, { color: '#62f0b6' });
    A.text(ctx, '隔一个信号：整拍 ≈ 725 ms', (xa + xc) / 2, y2 - 7, { size: 10, mono: true, color: '#62f0b6', align: 'center' });
  }
  A.text(ctx, '一次测量里两个峰：主峰 + 第二峰', bx, by - 14, { size: 13, color: '#e8f2ef' });
  A.text(ctx, '这不是噪声 —— 下一页解释为什么必须“跳一个峰”', bx + bw, by - 14, { size: 11.5, color: '#8fa5a2', align: 'right' });
}

function footer(ctx, s) {
  A.line(ctx, 40, 480, 1140, 480, { color: '#1d2c31' });
  A.text(ctx, '工程参数', 40, 502, { size: 10, mono: true, color: '#637875' });
  const items = [['采样', '1 kHz'], ['R 记录', '200 Hz'], ['峰阈值', '40'], ['基线 τ', '4 s'], ['窗长', '5 点']];
  let x = 120;

    A.text(ctx, v, x + 36, 502, { size: 11, mono: true, color: s >= 3 ? '#62f0b6' : '#c6d6d2' });
    x += 128;
  });
  A.text(ctx, '下一页：为什么要“跳一个峰” →', 1140, 502, { size: 10.5, mono: true, color: '#637875', align: 'right' });
}
