<script>
const VW = 1180, VH = 520;
function view(ctx, W, H) {
  const s = Math.min(W / VW, H / VH);
  ctx.save(); ctx.translate((W - VW * s) / 2, (H - VH * s) / 2); ctx.scale(s, s);
}
function header(ctx, title, sub) {
  A.text(ctx, title, 60, 34, { size: 20, serif: true, weight: 600 });
  A.text(ctx, sub, 60, 56, { size: 11.5, mono: true, color: '#637875' });
}
function footer(ctx, right) {
  A.line(ctx, 40, 480, 1140, 480, { color: '#1d2c31' });
  A.text(ctx, '验收口径', 40, 502, { size: 10, mono: true, color: '#637875' });
  const items = [['同刻', '同时读数'], ['样本', '2 人 / 多位置'], ['精度', '±2 BPM'], ['最好', '−0.2 BPM'], ['悬空', '0 误报']];
  let x = 130;
  items.forEach(([k, v]) => {
    A.text(ctx, k, x, 502, { size: 10, mono: true, color: '#637875' });
    A.text(ctx, v, x + 40, 502, { size: 11, mono: true, color: '#c6d6d2' });
    x += 180;
  });
  A.text(ctx, right, 1140, 502, { size: 10.5, mono: true, color: '#637875', align: 'right' });
}
function sequential(ctx, t, y0) {
  const bx = 70, by = y0 + 60, bw = 1000, bh = 240;
  A.grid(ctx, { x: bx, y: by, w: bw, h: bh }, { step: 36 });
  const yv = v => by + bh - (v - 60) / 30 * bh;
  [60, 75, 90].forEach(v => {
    A.line(ctx, bx - 5, yv(v), bx, yv(v), { color: '#2a4046' });
    A.text(ctx, v, bx - 9, yv(v) + 3, { size: 9.5, mono: true, color: '#637875', align: 'right' });
  });
  // physiological HR curve
  const pts = [];
  for (let i = 0; i <= 100; i++) {
    const u = i / 100;
    let hr;
    if (u < .15) hr = 68;
    else if (u < .45) hr = 68 + 14 * Math.sin((u - .15) / .3 * Math.PI);
    else hr = 68 + 2 * Math.exp(-(u - .45) * 8);
    pts.push([bx + u * bw, yv(hr)]);
  }
  A.path(ctx, pts, { color: '#ffb454', width: 2, glow: '#ffb454' });
  A.text(ctx, '真实心率（示意）', bx, by - 10, { size: 10.5, mono: true, color: '#ffb454' });
  A.text(ctx, '时间 →', bx + bw, by + bh + 36, { size: 9.5, mono: true, color: '#637875', align: 'right' });
  // measurement blocks
  const a1 = .32 * bw, a2 = .78 * bw;
  A.line(ctx, bx + a1, by, bx + a1, by + bh, { color: '#62f0b6', dash: [4, 4] });
  A.line(ctx, bx + a2, by, bx + a2, by + bh, { color: '#57c8ff', dash: [4, 4] });
  A.rr(ctx, bx + a1 - 70, by + 24, 140, 64, 3); ctx.fillStyle = 'rgba(98,240,182,.08)'; ctx.fill();
  ctx.strokeStyle = 'rgba(98,240,182,.4)'; ctx.stroke();
  A.text(ctx, '本机', bx + a1 - 56, by + 46, { size: 10, mono: true, color: '#62f0b6' });
  A.text(ctx, '82', bx + a1 - 56, by + 76, { size: 28, mono: true, color: '#62f0b6' });
  A.rr(ctx, bx + a2 - 70, by + 100, 140, 64, 3); ctx.fillStyle = 'rgba(87,200,255,.08)'; ctx.fill();
  ctx.strokeStyle = 'rgba(87,200,255,.4)'; ctx.stroke();
  A.text(ctx, '手表 ECG', bx + a2 - 56, by + 122, { size: 10, mono: true, color: '#57c8ff' });
  A.text(ctx, '68', bx + a2 - 56, by + 152, { size: 28, mono: true, color: '#57c8ff' });
  A.text(ctx, '两次测量不在同一刻：中间隔着按压/放松', 70, y0 + 330, { size: 14, color: '#e8f2ef' });
  A.text(ctx, '等长收缩升压、放松回落 —— 生理状态已经变了，差 14 BPM 不奇怪。', 70, y0 + 358, { size: 13, color: '#ff9a9a' });
  A.text(ctx, '结论：精度对比必须“同刻”，否则测的是两件事。', 70, y0 + 386, { size: 13, color: '#62f0b6' });
}
function simultaneous(ctx, t, y0) {
  // two clocks same time
  const cx1 = 240, cx2 = 500, cy = y0 + 150, r = 70;
  [cx1, cx2].forEach((cx, i) => {
    A.dot(ctx, cx, cy, r, 'rgba(14,22,25,.9)');
    ctx.save(); ctx.strokeStyle = i ? '#57c8ff' : '#62f0b6'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    A.text(ctx, i ? '手表' : '本机', cx, cy - 30, { size: 11, mono: true, color: i ? '#57c8ff' : '#62f0b6', align: 'center' });
    A.text(ctx, i ? '83' : '82.8', cx, cy + 18, { size: 26, mono: true, color: i ? '#57c8ff' : '#62f0b6', align: 'center' });
  });
  A.line(ctx, cx1 + r, cy, cx2 - r, cy, { color: '#ffb454', dash: [5, 4] });
  A.text(ctx, '同一秒', (cx1 + cx2) / 2, cy - 8, { size: 10, mono: true, color: '#ffb454', align: 'center' });
  // table
  const rows = [
    ['第 1 轮', '73', '75.2', '+2.2'],
    ['第 2 轮', '83', '82.8', '−0.2'],
    ['第 3 轮', '75', '74.1', '−0.9']
  ];
  const tx = 680, ty = y0 + 70;
  A.text(ctx, '同刻对照（手表 → 本机）', tx, ty, { size: 10.5, mono: true, color: '#637875' });
  A.text(ctx, '轮次', tx, ty + 30, { size: 9.5, mono: true, color: '#637875' });
  A.text(ctx, '手表', tx + 90, ty + 30, { size: 9.5, mono: true, color: '#637875' });
  A.text(ctx, '本机', tx + 170, ty + 30, { size: 9.5, mono: true, color: '#637875' });
  A.text(ctx, '误差', tx + 250, ty + 30, { size: 9.5, mono: true, color: '#637875' });
  rows.forEach((r, i) => {
    const y = ty + 58 + i * 34;
    A.line(ctx, tx, y + 10, tx + 340, y + 10, { color: '#1d2c31' });
    A.text(ctx, r[0], tx, y, { size: 11, color: '#8fa5a2' });
    A.text(ctx, r[1], tx + 90, y, { size: 12, mono: true, color: '#57c8ff' });
    A.text(ctx, r[2], tx + 170, y, { size: 12, mono: true, color: '#62f0b6' });
    A.text(ctx, r[3], tx + 250, y, { size: 12, mono: true, color: parseFloat(r[3]) > 0 ? '#ffb454' : '#62f0b6' });
  });
  A.text(ctx, '跨 2 名受试者、多位置，误差 ±2 BPM', 680, y0 + 250, { size: 13, color: '#e8f2ef' });
  A.text(ctx, '最好一轮 −0.2 BPM', 680, y0 + 278, { size: 13, color: '#62f0b6' });
  A.text(ctx, '系统偏置 +2~3 BPM 可标定扣除', 680, y0 + 312, { size: 10.5, color: '#8fa5a2' });
  A.text(ctx, '“同刻”二字比多测几轮更重要', 680, y0 + 344, { size: 11, color: '#ffb454' });
}
function scatter(ctx, t, y0) {
  const bx = 110, by = y0 + 60, bw = 500, bh = 300;
  const xmin = 66, xmax = 88, ymin = 66, ymax = 88;
  const X = v => bx + (v - xmin) / (xmax - xmin) * bw;
  const Y = v => by + bh - (v - ymin) / (ymax - ymin) * bh;
  A.grid(ctx, { x: bx, y: by, w: bw, h: bh }, { step: 40 });
  A.line(ctx, bx, by + bh, bx + bw, by, { color: '#2a4046', dash: [4, 4] });
  [68, 74, 80, 86].forEach(v => {
    A.text(ctx, v, X(v), by + bh + 16, { size: 9, mono: true, color: '#637875', align: 'center' });
    A.text(ctx, v, bx - 8, Y(v) + 3, { size: 9, mono: true, color: '#637875', align: 'right' });
  });
  // ±2 band
  ctx.save(); ctx.fillStyle = 'rgba(98,240,182,.08)';
  ctx.beginPath(); ctx.moveTo(X(xmin), Y(xmin - 2)); ctx.lineTo(X(xmax), Y(xmax - 2));
  ctx.lineTo(X(xmax), Y(xmax + 2)); ctx.lineTo(X(xmin), Y(xmin + 2)); ctx.closePath(); ctx.fill(); ctx.restore();
  const pts = [[73, 75.2], [83, 82.8], [75, 74.1]];
  pts.forEach((p, i) => {
    A.dot(ctx, X(p[0]), Y(p[1]), 5, i === 1 ? '#62f0b6' : '#ffb454', true);
    A.text(ctx, p[1].toFixed(1), X(p[0]) + 9, Y(p[1]) - 6, { size: 10, mono: true, color: i === 1 ? '#62f0b6' : '#ffb454' });
  });
  A.text(ctx, '手表 ECG / BPM', bx + bw, by + bh + 34, { size: 10, mono: true, color: '#637875', align: 'right' });
  A.text(ctx, '本机 / BPM', bx - 40, by - 14, { size: 10, mono: true, color: '#637875' });
  A.text(ctx, '±2 BPM 带', X(68) + 8, Y(72), { size: 9.5, mono: true, color: '#62f0b6' });
  // right summary
  const rx = 680;
  A.text(ctx, '三组同刻对照', rx, y0 + 90, { size: 11, mono: true, color: '#637875' });
  A.text(ctx, '±2', rx, y0 + 170, { size: 64, mono: true, color: '#62f0b6' });
  A.text(ctx, 'BPM', rx + 100, y0 + 170, { size: 14, mono: true, color: '#8fa5a2' });
  A.text(ctx, '跨 2 名受试者、多位置', rx, y0 + 210, { size: 12, color: '#8fa5a2' });
  A.text(ctx, '最好一轮 −0.2 BPM', rx, y0 + 240, { size: 13, color: '#ffb454' });
  A.text(ctx, '静息 76–78 · σ=0.7', rx, y0 + 280, { size: 12, mono: true, color: '#c6d6d2' });
  A.text(ctx, '悬空 120 s 假读数 0', rx, y0 + 306, { size: 12, mono: true, color: '#c6d6d2' });
  A.text(ctx, '松手 <1 s 归零', rx, y0 + 332, { size: 12, mono: true, color: '#c6d6d2' });
}
function segmented(ctx, t, y0) {
  // 30 s round with good/bad segments
  const bx = 70, by = y0 + 70, bw = 1000, bh = 120;
  const segs = [
    [0, 5, 42], [5, 7, 62], [7, 12, 38], [12, 20, 65], [20, 23, 44], [23, 30, 60]
  ];
  A.grid(ctx, { x: bx, y: by, w: bw, h: bh }, { step: 30 });
  A.text(ctx, '一轮 30 s 测量的分段 p95（示意，数值按实测等级）', bx, by - 12, { size: 10.5, mono: true, color: '#8fa5a2' });
  segs.forEach((s, i) => {
    const x1 = bx + s[0] / 30 * bw, x2 = bx + s[1] / 30 * bw;
    const good = s[2] >= 45;
    A.rr(ctx, x1 + 2, by + 20, x2 - x1 - 4, 80, 2);
    ctx.fillStyle = good ? 'rgba(98,240,182,.10)' : 'rgba(255,111,111,.10)'; ctx.fill();
    ctx.strokeStyle = good ? 'rgba(98,240,182,.4)' : 'rgba(255,111,111,.4)'; ctx.stroke();
    A.text(ctx, 'p95 ' + s[2], (x1 + x2) / 2, by + 66, { size: 9.5, mono: true, color: good ? '#8ef0c8' : '#ff9a9a', align: 'center' });
    if (!good) A.text(ctx, '剔', (x1 + x2) / 2, by + 86, { size: 9, mono: true, color: '#ff6f6f', align: 'center' });
  });
  // averages
  const ax = 70, ay = y0 + 240;
  A.text(ctx, '整轮平均', ax, ay, { size: 10, mono: true, color: '#637875' });
  A.text(ctx, '−9.4 BPM', ax, ay + 40, { size: 30, mono: true, color: '#ff6f6f' });
  A.text(ctx, '分段门控后', ax + 260, ay, { size: 10, mono: true, color: '#637875' });
  A.text(ctx, '−0.2 BPM', ax + 260, ay + 40, { size: 30, mono: true, color: '#62f0b6' });
  A.text(ctx, '同一轮数据，只是把弱耦合段剔除', ax, ay + 78, { size: 12, color: '#8fa5a2' });
  A.text(ctx, '→ 这不是改算法，是改“哪些段算数”', ax, ay + 104, { size: 12, color: '#ffb454' });
  // method note
  const rx = 700;
  A.text(ctx, '门控规则', rx, ay - 4, { size: 10, mono: true, color: '#637875' });
  A.text(ctx, 'p95 ≥ 45 且 p50 ≥ 18', rx, ay + 24, { size: 12, mono: true, color: '#c6d6d2' });
  A.text(ctx, '状态非 GOOD 的段不进门控统计', rx, ay + 50, { size: 11, color: '#8fa5a2' });
  A.text(ctx, '全程弱档不可救：拒绝出数，不硬凑', rx, ay + 76, { size: 11, color: '#ff9a9a' });
}
function checklist(ctx, t, y0) {
  const rows = [
    ['静息精度', '76–78 BPM · σ=0.7 · GOOD 96%', '#62f0b6'],
    ['同刻对照', '±2 BPM（最好 −0.2）', '#57c8ff'],
    ['悬空误报', '120 s → 0 s', '#a78bfa'],
    ['松手归零', '< 1 s', '#ffb454'],
    ['端到端', '79 条 / 36.9 s / 无断档', '#62f0b6']
  ];
  rows.forEach((r, i) => {
    const y = y0 + 44 + i * 62;
    const on = Math.floor(t / 1.1) >= i;
    A.rr(ctx, 70, y, 650, 50, 2);
    ctx.fillStyle = on ? 'rgba(255,255,255,.04)' : 'rgba(14,22,25,.55)'; ctx.fill();
    ctx.strokeStyle = on ? r[2] : '#1d2c31'; ctx.stroke();
    A.text(ctx, on ? '✓' : '·', 86, y + 31, { size: 15, mono: true, color: on ? r[2] : '#4d6663' });
    A.text(ctx, r[0], 112, y + 22, { size: 11, mono: true, color: r[2] });
    A.text(ctx, r[1], 112, y + 40, { size: 10.5, color: on ? '#c6d6d2' : '#4d6663' });
  });
  const rx = 780;
  A.text(ctx, '一句话验收', rx, y0 + 80, { size: 10, mono: true, color: '#637875' });
  A.text(ctx, '不是“能出数”，', rx, y0 + 124, { size: 18, serif: true, color: '#e8f2ef' });
  A.text(ctx, '而是“敢把数写进报告”。', rx, y0 + 156, { size: 18, serif: true, color: '#62f0b6' });
  A.text(ctx, '每一条都有对照、有数据、有边界。', rx, y0 + 206, { size: 11.5, color: '#8fa5a2' });
  A.text(ctx, '同刻 · 分段 · 诚实输出', rx, y0 + 240, { size: 12, mono: true, color: '#ffb454' });
}
const steps = [
  {
    tag: '陷阱', dur: 8,
    title: '你先跑、我再跑：比的不是同一场比赛',
    body: '先测本机、再测手表，中间隔着按压和放松：用力按会升压，放松又回落。两次不是同一个生理状态，差 14 BPM 完全可能 —— <span class="wrong">这不是精度问题，是实验设计问题</span>。',
    extra: '两个人先后跑 100 米，不能拿成绩当“同时跑”的差距。'
  },
  {
    tag: '同刻对照', dur: 8,
    title: '同刻对照：两个人同时按下秒表',
    body: '手表 ECG 和本机在同一秒读数：73 → 75.2（<b>+2.2</b>）、83 → 82.8（<b>−0.2</b>）、75 → 74.1（<b>−0.9</b>）。跨 2 名受试者、多位置，误差落在 <b>±2 BPM</b>。',
    extra: '“同刻”两个字，比多测十轮都重要。'
  },
  {
    tag: '看分布', dur: 7,
    title: '三个点都落在 ±2 BPM 带里',
    body: '把三组同刻对照画在“手表 vs 本机”的平面上：理想情况是落在 45° 对角线上。三个点都在 <b>±2 BPM</b> 带内，其中 83 → 82.8 几乎压线（<b>−0.2</b>）。',
    extra: '不是平均好看，而是每一轮都别偏出带子。'
  },
  {
    tag: '门控', dur: 8,
    title: '整轮 −9.4，把坏段剔掉变 −0.2',
    body: '一轮测量里既有好耦合段也有弱耦合段，整轮平均会被垃圾段拖坏。按 p95/状态把段切开，只统计好段：同一轮 <b>−9.4 → −0.2</b>。全程弱档不硬救，直接拒绝出数。',
    extra: '一锅汤里有一勺坏的：不能整锅倒掉，也不能闭眼喝，把坏的那勺舀掉。'
  },
  {
    tag: '验收', dur: 8,
    title: '把“精度”拆成可验收的几条',
    body: '静息 <b>76–78 BPM、波动 σ=0.7（很小）、GOOD 96%</b>；同刻 <b>±2 BPM</b>；悬空 <b>0 误报</b>；松手 <b><1 秒归零</b>；端到端 <b>79 条无断档</b>。每一条都能被独立复核。',
    extra: '可验收 = 有对照、有数字、有边界。'
  }
];
const deck = new Deck({
  steps,
  draw(ctx, W, H) {
    view(ctx, W, H);
    const y0 = 78, s = deck.step, t = deck.t;
    if (s === 0) { header(ctx, '为什么顺序测量会自相矛盾', '同一受试者 · 两次读数 · 不同生理状态'); sequential(ctx, t, y0); }
    else if (s === 1) { header(ctx, '同刻对照：两台设备同一秒读数', '手表 ECG vs 本机 · 3 轮'); simultaneous(ctx, t, y0); }
    else if (s === 2) { header(ctx, '三个点，一条对角线', '同刻对照分布 · ±2 BPM 带'); scatter(ctx, t, y0); }
    else if (s === 3) { header(ctx, '同一轮：整轮 −9.4，门控后 −0.2', '分段质量门控 · 只统计好段'); segmented(ctx, t, y0); }
    else { header(ctx, '精度验收清单', '每一条都能独立复核'); checklist(ctx, t, y0); }
    footer(ctx, '回到目录 →');
    ctx.restore();
  }
});
</script>
